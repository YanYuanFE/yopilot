version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: yopilot-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: yopilot-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
